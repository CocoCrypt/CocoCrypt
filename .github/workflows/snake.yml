name: Générer le serpent de contributions

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8B5CF6&color_dots=#ebedf0,#99f6e4,#2DD4BF,#3B82F6,#8B5CF6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#8B5CF6&color_dots=#161b22,#134e4a,#2DD4BF,#3B82F6,#8B5CF6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
