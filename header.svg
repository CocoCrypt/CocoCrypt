      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="14s" repeatCount="indefinite"/>
    </path>
  </g>
  <path d="M0,0H1200V215C1050,255 900,255 750,222C600,190 450,190 300,222C175,248 75,248 0,230Z" fill="url(#g)"/>
